name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version
        id: ver
        run: |
          VERSION=$(sed -n 's#.*<Version>\(.*\)</Version>.*#\1#p' JMSFusion.csproj)
          TAG="v${VERSION%.0}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip=JMSFusion-$VERSION-server.zip" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build -c Release

      - name: Package
        run: |
          cd bin/Release/net10.0
          zip -X "$GITHUB_WORKSPACE/${{ steps.ver.outputs.zip }}" Jellyfin.Plugin.JMSFusion.dll meta.json

      - name: Update manifest checksum
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          ZIP: ${{ steps.ver.outputs.zip }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os
          version, tag, zip_name = os.environ["VERSION"], os.environ["TAG"], os.environ["ZIP"]
          checksum = hashlib.md5(open(zip_name, "rb").read()).hexdigest()
          manifest = json.load(open("manifest.json"))
          entry = next((v for v in manifest[0]["versions"] if v["version"] == version), None)
          if entry is None:
              raise SystemExit(f"manifest.json has no entry for {version}; add one with changelog and targetAbi first")
          entry["sourceUrl"] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{zip_name}"
          entry["checksum"] = checksum
          entry["timestamp"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          json.dump(manifest, open("manifest.json", "w"), indent=2, ensure_ascii=False)
          open("manifest.json", "a").write("\n")
          print(f"{zip_name} md5 {checksum}")
          PY

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import json;v=[x for x in json.load(open('manifest.json'))[0]['versions'] if x['version']=='${{ steps.ver.outputs.version }}'][0];open('notes.md','w').write(v['changelog'])"
          gh release create "${{ steps.ver.outputs.tag }}" "${{ steps.ver.outputs.zip }}" \
            --target main --title "${{ steps.ver.outputs.tag }}" --notes-file notes.md

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest checksum for ${{ steps.ver.outputs.tag }}"
          git push origin HEAD:main
